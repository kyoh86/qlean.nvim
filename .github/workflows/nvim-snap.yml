name: nvim-snap

on:
  push:
  pull_request:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
      - name: Check version of Neovim
        run: nvim --version
      - name: Install nvim-snap
        run: |
          gh release download -R kyoh86/nvim-snap -p "nvim-snap_*_linux_amd64.tar.gz" -O /tmp/nvim-snap.tar.gz
          tar -xzf /tmp/nvim-snap.tar.gz -C /tmp
          install /tmp/nvim-snap /usr/local/bin/nvim-snap
      - name: Run snapshots
        run: |
          nvim-snap run --root . --cases-dir snapcase --format json
      - name: Compare snapshots
        run: |
          nvim-snap compare --root . --cases-dir snapcase --format html --diff-always
      - name: Listup files
        if: always()
        run: find . -type f
      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-snap-diff
          path: |
            **/diff/*
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-snap-log
          path: |
            **/.nvimlog
