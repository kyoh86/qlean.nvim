name: nvim-snap

on:
  push:
  pull_request:

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
      - name: Check version of Neovim
        run: nvim --version
      - name: Install nvim-snap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R kyoh86/nvim-snap -p "nvim-snap_*_linux_amd64.tar.gz" -O /tmp/nvim-snap.tar.gz
          tar -xzf /tmp/nvim-snap.tar.gz -C /tmp
          install /tmp/nvim-snap /usr/local/bin/nvim-snap
      - name: Generate baselines
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          nvim-snap golden --root . --cases-dir snapcase
      - name: Run snapshots
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          nvim-snap run --root . --cases-dir snapcase --format json
      - name: Compare snapshots
        run: |
          nvim-snap compare --root . --cases-dir snapcase --output diff --diff-format text --diff-always
      - name: Collect diffs
        if: always()
        run: |
          rm -rf .nvim-snap-diff
          mkdir -p .nvim-snap-diff
          find snapcase -path "*/diff/*" -type f -print0 | \
            while IFS= read -r -d '' file; do \
              case_name=$(basename "$(dirname "$(dirname "$file")")"); \
              ext=${file##*.}; \
              cp "$file" ".nvim-snap-diff/${case_name}.${ext}"; \
            done
      - name: Listup files
        if: always()
        run: find . -type f
      - name: Upload diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-snap-diff
          path: |
            .nvim-snap-diff/*
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvim-snap-log
          path: |
            **/.nvimlog
          include-hidden-files: true
